[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-1c-reconciliation"
version = "0.1.0"
description = "Стартовый проект сверки Wildberries, PostgreSQL-куба и 1С по ТЗ v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wb-reconcile = "wb_reconcile.cli:main"

[tool.setuptools.packages.find]
include = ["wb_reconcile*"]
